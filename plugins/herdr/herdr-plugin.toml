id = "pastures"
name = "Pastures"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Pick a live agent session by your own engagement, warmest first, and focus it."
platforms = ["linux", "macos"]

# Requires the `pastures` CLI on PATH (cargo install --git https://github.com/plainlystated/pastures),
# plus `jq` and `fzf`.

[[panes]]
id = "picker"
title = "Pastures"
placement = "popup"
width = "80%"
height = "70%"
command = ["sh", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/popup.sh\""]

[[actions]]
id = "open"
title = "Pastures: pick a session"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin pastures --entrypoint picker"]
